<!-- Ultimate Game Stash file-->

<html lang="en-us">
<head>
  <script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@f8f793bdb6914cf106283a8a29b7fc1fb671a2ff/edys%20car%20simulator/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Edys Car Simulator</title>
  <style>
    html,
    body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: visible;
      padding: 0;
      margin: 0;
    }

    div#gameContainer {
      background: transparent !important;
      position: absolute;
    }

    div#gameContainer canvas {
      position: absolute;
    }

    div#gameContainer canvas[data-pixel-art="true"] {
      position: absolute;
      image-rendering: optimizeSpeed;
      image-rendering: -webkit-crisp-edges;
      image-rendering: -moz-crisp-edges;
      image-rendering: -o-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: optimize-contrast;
      image-rendering: pixelated;
      -ms-interpolation-mode: nearest-neighbor;
    }
  </style>

  <style type="text/css">
    body {
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="gameContainer">
    <canvas id="unity-canvas" data-pixel-art=""></canvas>
    <script src="Build/game.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var config = {
        dataUrl: "Build/game.data.unityweb",
        frameworkUrl: "Build/game.framework.js.unityweb",
        codeUrl: "Build/game.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FreezeNova",
        productName: "EdyCarProject",
        productVersion: "0.1",
      };
      var scaleToFit = true;

      function progressHandler(progress) {
        var percent = progress * 100 + '%';
        canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
        canvas.style.backgroundSize = '100% 1rem';
      }

      function onResize() {
        var container = canvas.parentElement;
        var w = window.innerWidth;
        var h = window.innerHeight;
        var r = 600 / 960;
        if (w * r > window.innerHeight) {
          w = Math.min(w, Math.ceil(h / r));
        }
        h = Math.floor(w * r);
        container.style.width = canvas.style.width = w + "px";
        container.style.height = canvas.style.height = h + "px";
        container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
        container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
      }
      createUnityInstance(canvas, config, progressHandler).then(function(instance) {
        canvas = instance.Module.canvas;
        onResize();
      });
      window.addEventListener('resize', onResize);
      onResize();
    </script>
  </div>
</body>

</html>
