<!DOCTYPE html>
<html lang="en-us">

<head>
	<script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Elytra Flight</title>

	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
			background: #000;
		}

		#unity-container {
			width: 100%;
			height: 100%;
		}

		#unity-canvas {
			width: 100%;
			height: 100%;
			display: block;
		}
	</style>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/familiapablo/lopx@main/TemplateData/style.css">
</head>

<body class="dark">

	<div id="unity-container" class="unity-desktop">
		<canvas id="unity-canvas"></canvas>
	</div>

	<script>
    const buildUrl  = "https://cdn.jsdelivr.net/gh/familiapablo/lopx@main/Build";
    const loaderUrl = buildUrl + "/TPG_ElytraFlight_V01h.loader.js";

    const config = {
      dataUrl:       buildUrl + "/TPG_ElytraFlight_V01h.data.unityweb",
      frameworkUrl:  buildUrl + "/TPG_ElytraFlight_V01h.framework.js.unityweb",
      codeUrl:       buildUrl + "/TPG_ElytraFlight_V01h.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName:   "Cursora Labs OÜ",
      productName:   "Elytra Craft",
      productVersion:"0.1",
      devicePixelRatio: 1,
      webglContextAttributes: {
        preserveDrawingBuffer: true,
        powerPreference: "high-performance"
      }
    };

    const container = document.querySelector("#unity-container");
    const canvas    = document.querySelector("#unity-canvas");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      if (typeof createUnityInstance !== "function") {
        alert("Unity loader failed to load.");
        return;
      }

      createUnityInstance(canvas, config)
        .then(unityInstance => {
          // ready
        })
        .catch(message => {
          alert(message);
        });
    };

    script.onerror = () => {
      alert("Failed to load Unity loader script.");
    };

    document.body.appendChild(script);
	</script>
</body>

</html>
